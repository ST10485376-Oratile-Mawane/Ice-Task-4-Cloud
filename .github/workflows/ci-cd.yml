name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code and setup .NET SDK
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' # Adjust to your project's .NET version

    # 2. Build and run unit tests
    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    # 3. Package Docker container images & 4. Authenticate and push to Docker Hub
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile # Adjust path if your Dockerfile is in a specific folder
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/coffeenchill:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/coffeenchill:${{ github.sha }}

    # 5. SSH into remote VPS host and execute docker-compose pull && up -d
    - name: Deploy to Remote VPS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /path/to/your/project/on/vps
          docker-compose pull
          docker-compose up -d
